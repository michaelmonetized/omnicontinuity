[package]
name = "oc-clipboard"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Wayland text and PNG clipboard sync over SSH."
license = "MIT"

[dependencies]
anyhow = "1"
sha2 = "0.10"
tokio = { version = "1.53.3", features = ["io-util", "net", "process", "rt", "sync", "time", "macros"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", features = ["event", "fs", "process"] }
wl-clipboard-rs = "0.9.4"

[[bin]]
name = "oc-clipboard-bridge"
path = "src/bin/bridge.rs"
